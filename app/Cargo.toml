[package]
name = "seattrellis_web"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SeatTrellis local web workbench: loopback HTTP server + native solve, no Python/Node."

[dependencies]
seattrellis-server = { path = "../crates/seattrellis-server" }
seattrellis-domain = { path = "../crates/seattrellis-domain" }
seattrellis-io = { path = "../crates/seattrellis-io" }

[lib]
name = "seattrellis_web"
path = "src/lib.rs"

[[bin]]
name = "seattrellis_web"
path = "src/main.rs"
