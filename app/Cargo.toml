[package]
name = "seattrellis_app"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SeatTrellis desktop backend: thin facade over the split crates (M1-02), loopback HTTP server + native solve, no Python/Node."

[dependencies]
seattrellis-server = { path = "../crates/seattrellis-server" }
seattrellis-domain = { path = "../crates/seattrellis-domain" }
seattrellis-io = { path = "../crates/seattrellis-io" }

[lib]
name = "seattrellis_app"
path = "src/lib.rs"

[[bin]]
name = "seattrellis_app"
path = "src/main.rs"
