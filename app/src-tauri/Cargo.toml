[package]
name = "seattrellis_desktop"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
description = "SeatTrellis desktop shell (Tauri): WebView window over the loopback Rust backend."
license.workspace = true

[lib]
name = "seattrellis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The loopback backend core (serves the embedded React dist + native solve).
seattrellis-server = { path = "../../crates/seattrellis-server" }

[features]
# This feature is used for production builds (`cargo tauri build`) when no dev
# server is running; keep it so the bundler can produce a standalone .app.
custom-protocol = ["tauri/custom-protocol"]
