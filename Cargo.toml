# SeatTrellis root production workspace (M1-01).
#
# Unifies the former native/, app/ and app/src-tauri/ workspaces into a single
# lockfile and build graph. The legacy PyO3 compatibility crate has been
# removed; all production entry points use the Rust workspace below.

[workspace]
members = [
    "crates/seattrellis-core",
    "crates/seattrellis-cli",
    "app",
    "app/src-tauri",
    "xtask",
    "crates/seattrellis-schema",
    "crates/seattrellis-rules",
    "crates/seattrellis-export",
    "crates/seattrellis-domain",
    "crates/seattrellis-application",
    "crates/seattrellis-io",
    "crates/seattrellis-server",
]
default-members = [
    "crates/seattrellis-core",
    "crates/seattrellis-cli",
    "app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
