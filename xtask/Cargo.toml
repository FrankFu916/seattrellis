[package]
name = "xtask"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Development-only task runner: contract codegen (OpenAPI/TS) and release checks."

# Dev-only: never part of the production runtime or default-members.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The v2 artifact types are the JSON Schema source (M2-02).
seattrellis-schema = { path = "../crates/seattrellis-schema" }
seattrellis-rules = { path = "../crates/seattrellis-rules" }
schemars = { version = "1", features = ["derive"] }

[dev-dependencies]
jsonschema = { version = "0.51", default-features = false }
