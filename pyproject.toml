[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seattrellis"
version = "1.3.0"
description = "A privacy-first classroom seating planner for fair, constraint-based, and reproducible seat arrangements."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Frank Fu" }]
keywords = ["classroom", "seating", "optimization", "privacy", "fairness", "ortools", "streamlit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "pydantic>=1.10,<3",
  "typer>=0.9",
]

[project.optional-dependencies]
solver = ["ortools>=9.15,<9.16"]
excel = ["openpyxl>=3.1"]
image = ["Pillow>=9.4"]
web = ["streamlit>=1.50,<2"]
pdf = ["weasyprint>=60", "cffi>=2.0"]
docx = ["python-docx>=1.0"]
native = ["maturin>=1.8"]
dev = ["pytest>=7.0", "build>=1.2", "pypdf>=5"]
e2e = ["playwright>=1.40,<2", "pytest-playwright>=0.5,<1"]
docs = ["mkdocs-material==9.*"]
all = [
  "ortools>=9.15,<9.16",
  "openpyxl>=3.1",
  "Pillow>=9.4",
  "streamlit>=1.50,<2",
  "weasyprint>=60",
  "cffi>=2.0",
  "python-docx>=1.0",
]

[project.scripts]
seattrellis = "seattrellis.cli:main"
seatplanner = "seattrellis.cli:main"

[project.urls]
Homepage = "https://github.com/FrankFu916/seattrellis"
Repository = "https://github.com/FrankFu916/seattrellis"
Issues = "https://github.com/FrankFu916/seattrellis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
  "e2e: real-browser acceptance tests that require Playwright",
]
