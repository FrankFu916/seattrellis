[package]
name = "seattrellis-domain"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain layer for SeatTrellis: editor state machine, room templates and goal rules."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
keywords = ["seating", "classroom", "education", "solver"]
categories = ["command-line-utilities", "science"]

[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core", version = "2.0.0-rc.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
