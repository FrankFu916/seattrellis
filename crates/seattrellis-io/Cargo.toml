[package]
name = "seattrellis-io"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "File and persistence side of SeatTrellis: rosters, projects, migration, rotation plans and journaled transactions."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
keywords = ["seating", "classroom", "education", "solver"]
categories = ["command-line-utilities", "science"]

[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core", version = "2.0.0-rc.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seattrellis-schema = { path = "../seattrellis-schema", version = "2.0.0-rc.1" }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
