[package]
name = "seattrellis-rules"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rule metadata registry: the single source of truth for every official SeatTrellis rule."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
keywords = ["seating", "classroom", "education", "solver"]
categories = ["command-line-utilities", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }

[dev-dependencies]
jsonschema = "0.30"
