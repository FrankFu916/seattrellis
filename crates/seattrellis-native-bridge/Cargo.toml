[package]
name = "seattrellis-native-bridge"
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned in-process C ABI for SeatTrellis platform clients."
repository = "https://github.com/FrankFu916/seattrellis"

[lib]
name = "seattrellis_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
arc-swap = "1.7"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seattrellis-application = { path = "../seattrellis-application", version = "2.1.0" }
seattrellis-domain = { path = "../seattrellis-domain", version = "2.1.0" }
seattrellis-export = { path = "../seattrellis-export", version = "2.1.0" }
seattrellis_core = { path = "../seattrellis-core", version = "2.1.0" }
