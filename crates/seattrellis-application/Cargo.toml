[package]
name = "seattrellis-application"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application layer for SeatTrellis: use-case orchestration for generation and export."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
