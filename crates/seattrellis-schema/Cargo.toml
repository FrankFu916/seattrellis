[package]
name = "seattrellis-schema"
version = "2.0.0-rc.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SeatTrellis v2 durable artifact envelope, registry and typed wire DTOs."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
keywords = ["seating", "classroom", "education", "solver"]
categories = ["command-line-utilities", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
jsonschema = "0.30"
