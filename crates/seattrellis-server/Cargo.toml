[package]
name = "seattrellis-server"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Loopback HTTP transport for SeatTrellis: routes, adapter and embedded workbench assets."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
keywords = ["seating", "classroom", "education", "solver"]
categories = ["command-line-utilities", "science"]

[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core", version = "2.0.0-rc.1" }
seattrellis-domain = { path = "../seattrellis-domain", version = "2.0.0-rc.1" }
seattrellis-export = { path = "../seattrellis-export", version = "2.0.0-rc.1" }
seattrellis-application = { path = "../seattrellis-application", version = "2.0.0-rc.1" }
seattrellis-io = { path = "../seattrellis-io", version = "2.0.0-rc.1" }
seattrellis-rules = { path = "../seattrellis-rules", version = "2.0.0-rc.1" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = { version = "0.5", features = ["limit", "util"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
