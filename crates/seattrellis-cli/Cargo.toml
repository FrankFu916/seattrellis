[package]
name = "seattrellis_cli"
version = "2.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native command-line solver and exporter for SeatTrellis classroom seating."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
readme = "README.md"
keywords = ["seating", "classroom", "cli", "solver", "education"]
categories = ["command-line-utilities", "mathematics"]

# Deliberately minimal: a single path dependency on the core solver plus
# serde_json. No clap/structopt — argument parsing is hand-written to keep the
# binary small. serde_json is already in the workspace lockfile via the core.
# `png` (with its bundled flate2/miniz_oxide zlib) adds PNG export; PDF export
# is hand-written straight into the binary (no extra crate) to stay small.
[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core", version = "2.0.0-rc.1" }
seattrellis-io = { path = "../../crates/seattrellis-io", version = "2.0.0-rc.1" }
seattrellis-export = { path = "../../crates/seattrellis-export", version = "2.0.0-rc.1" }
seattrellis-application = { path = "../../crates/seattrellis-application", version = "2.0.0-rc.1" }
seattrellis-domain = { path = "../../crates/seattrellis-domain", version = "2.0.0-rc.1" }
seattrellis-schema = { path = "../../crates/seattrellis-schema", version = "2.0.0-rc.1" }
serde_json = "1"
png = "0.17"

[[bin]]
name = "seattrellis_cli"
path = "src/main.rs"
