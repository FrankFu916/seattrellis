[package]
name = "seattrellis"
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native command-line solver and exporter for SeatTrellis classroom seating."
repository = "https://github.com/FrankFu916/seattrellis"
homepage = "https://github.com/FrankFu916/seattrellis"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "schemas/**"]
keywords = ["seating", "classroom", "cli", "solver", "education"]
categories = ["command-line-utilities", "mathematics"]

# The CLI delegates validation, application workflows, durable IO and export
# to the shared Rust crates. Argument parsing stays dependency-free.
[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core", version = "2.1.0" }
seattrellis-io = { path = "../../crates/seattrellis-io", version = "2.1.0" }
seattrellis-export = { path = "../../crates/seattrellis-export", version = "2.1.0" }
seattrellis-application = { path = "../../crates/seattrellis-application", version = "2.1.0" }
seattrellis-domain = { path = "../../crates/seattrellis-domain", version = "2.1.0" }
seattrellis-schema = { path = "../../crates/seattrellis-schema", version = "2.1.0" }
serde_json = "1"
png = "0.18"

[[bin]]
name = "seattrellis"
path = "src/main.rs"
