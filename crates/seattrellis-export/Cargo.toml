[package]
name = "seattrellis-export"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Export/render primitives: solved plan to SVG / HTML / PNG / PDF / XLSX / DOCX / PPTX bytes (M1-02 crate split)."

[dependencies]
seattrellis_core = { path = "../../crates/seattrellis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
quick-xml = "0.41"
