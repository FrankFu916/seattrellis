name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-msrv:
    name: Rust workspace / 1.88 MSRV
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88
      - name: Install CJK fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      # Test the whole workspace at MSRV, not just core: a per-crate list
      # previously skipped other crates and let an MSRV compile break ship
      # undetected. The PyO3 shim is excluded from the workspace already.
      - name: Test the Rust workspace at MSRV
        run: cargo test --locked --workspace

  web-e2e-rust:
    # M2 §5.7 item 2: the NO_PYTHON_RUNTIME browser E2E. The whole
    # import -> solve/candidates -> edit/repair -> save/rotation -> export ->
    # reopen workflow runs against the compiled Rust server and the compiled
    # React workbench in a real Chromium. This job deliberately installs NO
    # Python package: Python is only the pytest/Playwright runner, and the
    # fixture asserts the serving process is the native `seattrellis_app`
    # binary (ELF/Mach-O), not a Python interpreter.
    name: Web E2E (Rust backend) / Ubuntu / Chromium
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Build the React workbench
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      - uses: dtolnay/rust-toolchain@1.88
      - name: Build the Rust server and CLI (release)
        run: cargo build --locked --release -p seattrellis_app -p seattrellis_cli
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e-rust/constraints.txt
      - name: Install browser test runner only (no SeatTrellis package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c e2e-rust/constraints.txt pytest-playwright playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run NO_PYTHON_RUNTIME workbench E2E
        env:
          SEATTRELLIS_E2E_RESULTS: test-results-rust
          SEATTRELLIS_E2E_RUST_SERVER: ${{ github.workspace }}/target/release/seattrellis_app
          SEATTRELLIS_E2E_RUST_CLI: ${{ github.workspace }}/target/release/seattrellis_cli
          SEATTRELLIS_WEB_STATIC: ${{ github.workspace }}/clients/web/dist
        run: >-
          python -m pytest e2e-rust
          --browser=chromium
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results-rust/playwright
          --basetemp=.e2e-rust-tmp
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-rust-failure
          path: test-results-rust/
          if-no-files-found: ignore

  parity-oracle:
    # M0-02/M0-03: the frozen Python oracle corpus must stay byte-stable.
    # Regenerates every fixtures/parity case into a temp dir and compares the
    # inputs and goldens against the committed corpus (SHA-256 in MANIFEST).
    # Python is pinned to 3.12 to match the oracle generation environment.
    name: Oracle parity corpus / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the frozen oracle from the v1.9.0 tag
        # M6: the v2 tree is Python-free; the oracle is pinned from the
        # v1.x-maintenance line so the byte-stable replay keeps running.
        # Extras must match the generation environment (Pillow/WeasyPrint/
        # openpyxl/python-docx/python-pptx) or export exit codes differ.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "seattrellis[image,excel,pdf,docx,pptx] @ git+https://github.com/FrankFu916/seattrellis@v1.9.0"
      - name: Replay the oracle golden corpus (byte-stable)
        run: python scripts/gen_parity_fixtures.py verify

  rust-python-differential:
    # M0-03: the seven-state Rust↔Python differential must run in CI, not
    # only locally. The fixture corpus (41 cases) plus the candidate-set
    # class (20/40/50/60/80 × 1/5/20) are solved by both the Python oracle
    # (fallback backend) and the release Rust CLI; any mismatch fails.
    name: Rust↔Python differential / fixtures + candidates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the frozen oracle from the v1.9.0 tag
        # M6: the v2 tree is Python-free; the differential runs against the
        # frozen v1 oracle (v1.x-maintenance line).
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "seattrellis[all] @ git+https://github.com/FrankFu916/seattrellis@v1.9.0" pypdf pytest
      - name: Build the release CLI
        run: cargo build --release --locked -p seattrellis_cli
      - name: Run the fixture + candidates + scoring + exports differential
        # Strict M0-03 mode: the corpus is fully green (41/41) since the
        # invalid-rule/bad-adjacency gaps closed (ledger §19.5); the
        # candidate-set class (15 combos), the fixed-assignment PlanScore
        # class (all valid fixture cases) and the Office export
        # independent-reader class (34 cases × XLSX/DOCX/PPTX teacher +
        # public privacy) are part of the same run; any mismatch fails the
        # job. The script must run from the venv that carries the installed
        # oracle package.
        run: .venv/bin/python scripts/rust_python_diff.py --fixtures --candidates --scoring --exports --rotation --cli-golden
