name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimal:
    name: Minimal / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: CLI help smoke test
        run: seattrellis --help
      - name: Run minimal install tests
        run: python -m pytest tests/test_minimal_install.py

  full:
    name: Full / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install full package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m build
      - name: Build documentation strictly
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict
      - name: Run Rust core tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: cargo test --manifest-path native/Cargo.toml
      - name: CLI workflow smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/smoke_cli.py --optional auto --time-limit 3

  native-extension:
    name: Native extension / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install application and native build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . maturin pytest
      - name: Build the optional native extension wheel
        run: >-
          python -m maturin build
          --release
          --manifest-path native/seattrellis_native/Cargo.toml
          --interpreter python
          --out dist/native
      - name: Install the optional native extension wheel
        run: >-
          python -m pip install
          --no-index
          --find-links dist/native
          --force-reinstall
          --no-deps
          seattrellis-native
      - name: Verify the installed native backend
        run: python -m pytest tests/test_solver_backend_contract.py

  web-e2e:
    name: Web E2E / Ubuntu / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            e2e/constraints.txt
      - name: Install Web application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c e2e/constraints.txt -e ".[web,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser acceptance test
        env:
          SEATTRELLIS_E2E_RESULTS: test-results
        run: >-
          python -m pytest e2e
          --browser=chromium
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results/playwright
          --basetemp=.pytest_cache/e2e-tmp
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: test-results/
          if-no-files-found: ignore
