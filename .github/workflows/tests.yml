name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-smoke:
    name: Draft / Ubuntu / Python 3.14
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[web]"
      - name: Run focused draft checks
        run: >-
          python -m pytest
          tests/test_minimal_install.py
          tests/test_roster_import.py
          tests/test_room_templates.py
          tests/test_teacher_goals.py
          tests/test_class_workflow.py
          tests/test_web_class_adapter.py
          tests/test_teacher_state.py
          tests/test_teacher_web_copy.py
          tests/test_teacher_page.py
          tests/test_interactive_panel_workspace.py
          tests/test_web_tempfiles.py
          tests/test_web_workflow.py

  minimal:
    name: Minimal / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: CLI help smoke test
        run: seattrellis --help
      - name: Run minimal install tests
        run: python -m pytest tests/test_minimal_install.py

  full:
    name: Full / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install full package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m build
      - name: Build documentation strictly
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict
      - name: CLI workflow smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python scripts/smoke_cli.py --optional auto --time-limit 3

  rust-msrv:
    name: Rust workspace / 1.88 MSRV
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.88
      - name: Test the Rust core
        run: cargo test --locked -p seattrellis_core
      - name: Check the Python extension crate
        run: >-
          cargo check --locked
          -p seattrellis_native
          --features extension-module

  native-extension:
    name: Native extension / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            native/seattrellis_native/pyproject.toml
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install application and native build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . maturin pytest
      - name: Build the optional native extension wheel
        run: >-
          python -m maturin build
          --release
          --locked
          --manifest-path native/seattrellis_native/Cargo.toml
          --interpreter python
          --out dist/native
      - name: Retain the experimental native wheel
        uses: actions/upload-artifact@v7
        with:
          name: native-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/native/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Install the optional native extension wheel
        run: >-
          python -m pip install
          --no-index
          --find-links dist/native
          --force-reinstall
          --no-deps
          seattrellis-native
      - name: Verify the installed native backend
        run: python -m pytest tests/test_solver_backend_contract.py

  web-e2e:
    name: Web E2E / Ubuntu / Chromium
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            e2e/constraints.txt
      - name: Install Web application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c e2e/constraints.txt -e ".[web,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser acceptance test
        env:
          SEATTRELLIS_E2E_RESULTS: test-results
        run: >-
          python -m pytest e2e
          --browser=chromium
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=test-results/playwright
          --basetemp=.e2e-tmp
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-failure
          path: test-results/
          if-no-files-found: ignore

  parity-oracle:
    # M0-02/M0-03: the frozen Python oracle corpus must stay byte-stable.
    # Regenerates every fixtures/parity case into a temp dir and compares the
    # inputs and goldens against the committed corpus (SHA-256 in MANIFEST).
    # Python is pinned to 3.12 to match the oracle generation environment.
    name: Oracle parity corpus / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package (oracle extras + fallback backend)
        # The corpus was generated with the export optional-dependency extras
        # installed (Pillow/WeasyPrint/openpyxl/python-docx/python-pptx); the
        # verify run must match that environment or export exit codes differ.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[image,excel,pdf,docx,pptx]"
      - name: Replay the oracle golden corpus (byte-stable)
        run: python scripts/gen_parity_fixtures.py verify

  rust-python-differential:
    # M0-03: the seven-state Rust↔Python differential must run in CI, not
    # only locally. Every fixtures/parity case is solved by both the Python
    # oracle (fallback backend) and the release Rust CLI; any mismatch fails.
    name: Rust↔Python differential / fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Python oracle into a venv (fallback backend)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[all]"
      - name: Build the release CLI
        run: cargo build --release --locked -p seattrellis_cli
      - name: Run the fixture differential
        # CI mode tolerates exactly the case-level documented corpus gaps
        # (invalid-unknown-rule / invalid-unknown-soft-objective /
        # invalid-bad-adjacency-ref, tracked in the parity ledger); any new
        # mismatch fails the run. The script must run from the venv that
        # carries the installed oracle package.
        run: .venv/bin/python scripts/rust_python_diff.py --fixtures --allow-documented-gaps
