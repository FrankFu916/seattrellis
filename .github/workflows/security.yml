name: Security and package hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-hygiene:
    name: Draft repository hygiene
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tracked files and package version
        run: |
          python scripts/check_repository_hygiene.py
          python scripts/check_release_version.py

  dependency-audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[all,dev]" pip-audit
      - name: Audit installed dependencies
        # The five listed starlette advisories are only fixed in the 1.x line,
        # which requires FastAPI 0.138+ and a pydantic v2 migration of the
        # shared models. The migration is tracked on the roadmap, and the
        # residual advisories are documented there. Remove these exclusions
        # when the migration lands and starlette is raised to 1.x.
        run: >-
          python -m pip_audit
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-hygiene:
    name: Repository and package hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tracked files
        run: python scripts/check_repository_hygiene.py
      - name: Check package version consistency
        run: python scripts/check_release_version.py
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Check distribution contents
        run: |
          for archive in dist/*; do
            python scripts/check_repository_hygiene.py --archive "$archive"
          done
