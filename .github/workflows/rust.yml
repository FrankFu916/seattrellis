name: Rust

# The Rust core, CLI, and desktop app are the primary distribution path going
# forward; the Python package is a compatibility/library option.  This
# workflow keeps the native workspace and the desktop server tested on every
# supported platform and builds release binaries for the CLI and App server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the core
        run: cargo test --locked --manifest-path native/Cargo.toml -p seattrellis_core
      - name: Test the CLI
        run: cargo test --locked --manifest-path native/Cargo.toml -p seattrellis_cli
      - name: Test the desktop app server
        run: cargo test --manifest-path app/Cargo.toml
      - name: Clippy (core + CLI)
        run: cargo clippy --all-targets --manifest-path native/Cargo.toml -p seattrellis_core -p seattrellis_cli -- -D warnings
      - name: Clippy (app)
        run: cargo clippy --all-targets --manifest-path app/Cargo.toml -- -D warnings

  msrv:
    name: Rust core / 1.83 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.83
      - name: Test the core at MSRV
        run: cargo test --locked --manifest-path native/Cargo.toml -p seattrellis_core

  build-binaries:
    name: Build release binaries / ${{ matrix.os }}
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --release --locked --manifest-path native/Cargo.toml -p seattrellis_cli
      - name: Build the App server
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Upload CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-cli-${{ matrix.os }}
          path: |
            native/target/release/seattrellis_cli
            native/target/release/seattrellis_cli.exe
          if-no-files-found: error
      - name: Upload App server binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-app-${{ matrix.os }}
          path: |
            app/target/release/seattrellis_app
            app/target/release/seattrellis_app.exe
          if-no-files-found: error
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -eux
          cd native/target/release
          if [ -f seattrellis_cli ]; then gh release upload "$RELEASE_TAG" seattrellis_cli --clobber; fi
          if [ -f seattrellis_cli.exe ]; then gh release upload "$RELEASE_TAG" seattrellis_cli.exe --clobber; fi
          cd ../../../app/target/release
          if [ -f seattrellis_app ]; then gh release upload "$RELEASE_TAG" seattrellis_app --clobber; fi
          if [ -f seattrellis_app.exe ]; then gh release upload "$RELEASE_TAG" seattrellis_app.exe --clobber; fi
