name: Rust

# The shared release gates run on the exact source ref for CLI, server and desktop.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
        description: Exact commit or tag to validate
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  # Only the release publish-assets job needs contents: write (gh release
  # upload); every other job runs read-only.
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}

  security-quality:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}

  release-version:
    if: startsWith(github.event.release.tag_name, 'v2.') || startsWith(github.event.release.tag_name, 'desktop-v') || startsWith(inputs.ref, 'refs/tags/') || startsWith(inputs.ref, 'v2.') || startsWith(inputs.ref, 'desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag matches every product version
        env:
          RELEASE_TAG: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"

  test:
    name: Rust MSRV 1.88.0 test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Tauri system libraries (Linux)
        # The workspace test matrix includes the Tauri desktop shell
        # (seattrellis_desktop), whose glib-sys/gtk-sys build scripts need
        # the WebKitGTK stack (same list as the tauri.yml bundler job).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      # The server build script embeds clients/web/dist (M6 decoupling), so
      # the React workbench must exist before any crate that pulls in
      # seattrellis-server can compile.
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      # Test every crate: the previous per-crate list silently skipped
      # schema/domain/export/io/rules/application/server, which let an
      # MSRV compile break in seattrellis-schema ship undetected
      # (schema audit 2026-08-12).
      - name: Test the workspace
        run: cargo test --locked --workspace
      - name: Clippy (workspace)
        run: cargo clippy --all-targets --workspace -- -D warnings

  contract-drift:
    # M1-06: the OpenAPI document and the generated TypeScript client must
    # never diverge from the declarative spec (xtask/src/spec.rs). Regenerate
    # into a temp dir and compare with the committed artifacts.
    name: Contract artifacts / drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Check generated contract artifacts are up to date
        run: cargo run -p xtask -- contract check

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Check formatting
        run: cargo fmt --check

  dependency-audit:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  long-run-gates:
    # M3 evidence that is release-only (the 80x20 candidate combination and
    # the 20-period rotation cost minutes in debug): candidate gate, long-run
    # solver gate (500 solves + RSS stability + cancel latency + planted
    # corpus >=99.5% with zero false infeasible) and the rotation gate
    # (1/3/5/10/20 periods, deterministic, per-period validated).
    name: Long-run gates (release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Candidate + long-run gates
        run: cargo test --release --locked -p seattrellis_core --test candidates_gate --test long_run_gate -- --ignored
      - name: Install independent Office reader and fonts
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - name: Word pagination and complete-text reader gate
        run: cargo test --release --locked -p seattrellis-export --test export_options word_reader -- --ignored
      - name: Rotation gate
        run: cargo test --release --locked -p seattrellis-application --test rotation_gate -- --ignored
      - name: Solver performance regression gate
        run: |
          cargo build --release --locked -p seattrellis
          python3 scripts/bench_solver.py --check

  fuzz-targets:
    # plan §11.4: libFuzzer targets must build and survive bounded runs on
    # every PR. cargo-fuzz needs the nightly toolchain.
    name: Fuzz targets (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: |
          cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          cargo +nightly fuzz build
      - name: Bounded fuzz runs
        run: |
          for target in solve_request dto_parsers csv_importer editor_commands export_options migration; do
            cargo +nightly fuzz run "$target" -- -runs=3000 -max_total_time=120
          done

  no-python-runtime:
    # M6 §9.1 red line: the v2 artifacts must not probe or load a Python
    # runtime. The release CLI and App server are scanned for libpython /
    # PyO3 / v1-stack symbols, and the production tree for Python build
    # dependencies. After M6 retirement the tree gate runs with
    # --expect-retired (the oracle tree must be gone).
    name: No Python runtime in v2 artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      - name: Build the CLI and App server
        run: |
          cargo build --release --locked -p seattrellis
          cargo build --release --locked -p seattrellis_web
      - name: Scan the production tree and the release binaries
        run: |
          python3 scripts/check_no_python_runtime.py --tree --expect-retired
          python3 scripts/check_no_python_runtime.py --binary target/release/seattrellis target/release/seattrellis_web

  build-binaries:
    name: Build release binaries / ${{ matrix.os }}
    # v2 releases only: the v1 line (v1.* tags) publishes Python wheel/sdist
    # + desktop bundles from the maintenance branch, and must not receive
    # Rust binaries (the v1.9.0 release initially did — fixed).
    if: >-
      inputs.ref == '' && github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'v2.')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || (github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name)) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      - name: Build the CLI
        run: cargo build --release --locked -p seattrellis
      - name: Build the App server
        run: cargo build --release --locked -p seattrellis_web
      - name: Upload CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-cli-${{ matrix.os }}
          path: |
            target/release/seattrellis
            target/release/seattrellis.exe
          if-no-files-found: error
      - name: Upload App server binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-app-${{ matrix.os }}
          path: |
            target/release/seattrellis_web
            target/release/seattrellis_web.exe
          if-no-files-found: error

  publish-assets:
    name: Publish release binaries
    if: inputs.ref == '' && github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v2.')
    # Building alone is not a release gate. Every quality job must succeed
    # before any Rust binary or checksum is attached to the published release.
    needs:
      - build-binaries
      - release-version
      - web-quality
      - security-quality
      - test
      - contract-drift
      - fmt
      - dependency-audit
      - long-run-gates
      - fuzz-targets
      - no-python-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform binaries
        uses: actions/download-artifact@v7
        with:
          pattern: seattrellis-*
          path: artifacts
          merge-multiple: false
      - name: Rename binaries and create checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -eux
          mkdir -p release
          for kind in cli app; do
            for artifact in artifacts/seattrellis-${kind}-*; do
              [ -d "$artifact" ] || continue
              platform="${artifact#artifacts/seattrellis-${kind}-}"
              source="$(find "$artifact" -maxdepth 1 -type f | head -n 1)"
              [ -n "$source" ]
              suffix=""
              case "$source" in
                *.exe) suffix=".exe" ;;
              esac
              cp "$source" "release/seattrellis-${kind}-${platform}${suffix}"
            done
          done
          test "$(find release -type f | wc -l)" -eq 6
          (cd release && sha256sum seattrellis-* > SHA256SUMS)
      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/*
