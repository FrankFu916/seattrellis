name: Rust

# The Rust core, CLI, and desktop app are the primary distribution path going
# forward; the Python package is a compatibility/library option.  This
# workflow keeps the native workspace and the desktop server tested on every
# supported platform and builds release binaries for the CLI and App server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  # Only the release publish-assets job needs contents: write (gh release
  # upload); every other job runs read-only.
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install Tauri system libraries (Linux)
        # The workspace test matrix includes the Tauri desktop shell
        # (seattrellis_desktop), whose glib-sys/gtk-sys build scripts need
        # the WebKitGTK stack (same list as the tauri.yml bundler job).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      # The server build script embeds clients/web/dist (M6 decoupling), so
      # the React workbench must exist before any crate that pulls in
      # seattrellis-server can compile.
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      # Test every crate: the previous per-crate list silently skipped
      # schema/domain/export/io/rules/application/server, which let an
      # MSRV compile break in seattrellis-schema ship undetected
      # (schema audit 2026-08-12). The PyO3 shim stays excluded.
      - name: Test the workspace (except the PyO3 shim)
        run: cargo test --locked --workspace
      - name: Clippy (workspace, except the PyO3 shim)
        run: cargo clippy --all-targets --workspace -- -D warnings

  contract-drift:
    # M1-06: the OpenAPI document and the generated TypeScript client must
    # never diverge from the declarative spec (xtask/src/spec.rs). Regenerate
    # into a temp dir and compare with the committed artifacts.
    name: Contract artifacts / drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check generated contract artifacts are up to date
        run: cargo run -p xtask -- contract check

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check

  dependency-audit:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  msrv:
    name: Rust core / 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - name: Test the core at MSRV
        run: cargo test --locked -p seattrellis_core

  long-run-gates:
    # M3 evidence that is release-only (the 80x20 candidate combination and
    # the 20-period rotation cost minutes in debug): candidate gate, long-run
    # solver gate (500 solves + RSS stability + cancel latency + planted
    # corpus >=99.5% with zero false infeasible) and the rotation gate
    # (1/3/5/10/20 periods, deterministic, per-period validated).
    name: Long-run gates (release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Candidate + long-run gates
        run: cargo test --release --locked -p seattrellis_core --test candidates_gate --test long_run_gate -- --ignored
      - name: Rotation gate
        run: cargo test --release --locked -p seattrellis-application --test rotation_gate -- --ignored
      - name: Solver performance regression gate
        run: |
          cargo build --release --locked -p seattrellis_cli
          python3 scripts/bench_solver.py --check

  fuzz-targets:
    # plan §11.4: libFuzzer targets must build and survive bounded runs on
    # every PR. cargo-fuzz needs the nightly toolchain.
    name: Fuzz targets (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      - name: Bounded fuzz runs
        run: |
          for target in solve_request dto_parsers csv_importer editor_commands export_options migration; do
            cargo +nightly fuzz run "$target" -- -runs=3000 -max_total_time=120
          done

  no-python-runtime:
    # M6 §9.1 red line: the v2 artifacts must not probe or load a Python
    # runtime. The release CLI and App server are scanned for libpython /
    # PyO3 / v1-stack symbols, and the production tree for Python build
    # dependencies. After M6 retirement the tree gate runs with
    # --expect-retired (the oracle tree must be gone).
    name: No Python runtime in v2 artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      - name: Build the CLI and App server
        run: |
          cargo build --release --locked -p seattrellis_cli
          cargo build --release --locked -p seattrellis_app
      - name: Scan the production tree and the release binaries
        run: |
          python3 scripts/check_no_python_runtime.py --tree --expect-retired
          python3 scripts/check_no_python_runtime.py --binary target/release/seattrellis_cli target/release/seattrellis_app

  build-binaries:
    name: Build release binaries / ${{ matrix.os }}
    # v2 releases only: the v1 line (v1.* tags) publishes Python wheel/sdist
    # + desktop bundles from the maintenance branch, and must not receive
    # Rust binaries (the v1.9.0 release initially did — fixed).
    if: >-
      github.event_name == 'release' &&
      !startsWith(github.event.release.tag_name, 'v1.')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the React workbench (server embeds clients/web/dist)
        run: |
          npm ci
          npm run build
        working-directory: clients/web
      - name: Build the CLI
        run: cargo build --release --locked -p seattrellis_cli
      - name: Build the App server
        run: cargo build --release --locked -p seattrellis_app
      - name: Upload CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-cli-${{ matrix.os }}
          path: |
            target/release/seattrellis_cli
            target/release/seattrellis_cli.exe
          if-no-files-found: error
      - name: Upload App server binary
        uses: actions/upload-artifact@v7
        with:
          name: seattrellis-app-${{ matrix.os }}
          path: |
            target/release/seattrellis_app
            target/release/seattrellis_app.exe
          if-no-files-found: error

  publish-assets:
    name: Publish release binaries
    if: github.event_name == 'release'
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform binaries
        uses: actions/download-artifact@v7
        with:
          pattern: seattrellis-*
          path: artifacts
          merge-multiple: false
      - name: Rename binaries and create checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -eux
          mkdir -p release
          for kind in cli app; do
            for artifact in artifacts/seattrellis-${kind}-*; do
              [ -d "$artifact" ] || continue
              platform="${artifact#artifacts/seattrellis-${kind}-}"
              source="$(find "$artifact" -maxdepth 1 -type f | head -n 1)"
              [ -n "$source" ]
              suffix=""
              case "$source" in
                *.exe) suffix=".exe" ;;
              esac
              cp "$source" "release/seattrellis-${kind}-${platform}${suffix}"
            done
          done
          test "$(find release -type f | wc -l)" -eq 6
          (cd release && sha256sum seattrellis-* > SHA256SUMS)
      - name: Attach binaries and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/* --clobber
