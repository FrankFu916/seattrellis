name: Benchmark artifacts

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: ${{ matrix.size }} / ${{ matrix.profile }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        size: [40, 50, 60]
        profile: [light, dense]
        backend: [fallback, ortools]
    env:
      BENCHMARK_TIME_LIMIT: ${{ matrix.backend == 'fallback' && '0.25' || '5' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[solver]"
      - name: Run fixed benchmark matrix
        run: >-
          python scripts/benchmark_solver.py
          --sizes "${{ matrix.size }}"
          --backends "${{ matrix.backend }}"
          --constraint-profiles "${{ matrix.profile }}"
          --candidate-counts 1,5,20
          --time-limit "$BENCHMARK_TIME_LIMIT"
          --max-attempts 24
          --output outputs/benchmark-solver.json
          --markdown-output outputs/benchmark-solver.md
          --quiet
      - name: Add report to workflow summary
        if: always() && hashFiles('outputs/benchmark-solver.md') != ''
        run: cat outputs/benchmark-solver.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.size }}-${{ matrix.profile }}-${{ matrix.backend }}-${{ github.run_id }}
          path: outputs/benchmark-solver.*
          if-no-files-found: error
          retention-days: 30
