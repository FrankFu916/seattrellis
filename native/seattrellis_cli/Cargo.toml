[package]
name = "seattrellis_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Standalone solve + export CLI for SeatTrellis (Rust path deliverable)."

# Deliberately minimal: a single path dependency on the core solver plus
# serde_json. No clap/structopt — argument parsing is hand-written to keep the
# binary small. serde_json is already in the workspace lockfile via the core.
[dependencies]
seattrellis_core = { path = "../seattrellis_core" }
serde_json = "1"

[[bin]]
name = "seattrellis_cli"
path = "src/main.rs"
