# SeatTrellis cargo-deny policy (M2 E.18): fail on advisories, two unmatched
# licenses, and unknown registries. Dependency versions come from the shared
# workspace lockfile (M1-01); the target list mirrors what CI builds.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # gtk-rs GTK3 bindings carry a family of unmaintained advisories; they
    # are pinned transitively by the Tauri 2 Linux stack (tauri/tao/wry) and
    # have no patched GTK3 successor. The desktop shell targets macOS and
    # Windows in practice.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # unic-* (unicode character property tables, transitive) are unmaintained
    # but stable data crates with no successor; RUSTSEC-2025-0098/0100 are the
    # same family (unicode-ident / unicode-bidi style data crates).
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # ttf-parser is unmaintained (no safe upgrade) and is a transitive
    # dependency of fontdue, the chosen M5-A4 rasterizer for PNG text. The
    # alternative (skrifa) would swap the font stack for a maintenance
    # benefit with no security issue; re-evaluate at M7.
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
skip = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Weak copyleft in the Tauri/dom_query dependency tree.
    "MPL-2.0",
    # LLVM/rustc toolchain crates carry the exception clause.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
