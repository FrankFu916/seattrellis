# SeatTrellis cargo-deny policy (M2 E.18): fail on advisories, two unmatched
# licenses, and unknown registries. Dependency versions come from the shared
# workspace lockfile (M1-01); the target list mirrors what CI builds.
[advisories]
version = 2
yanked = "deny"
# gtk-rs GTK3 bindings carry a family of unmaintained advisories
# (RUSTSEC-2024-0411..0420): they are pinned transitively by the Tauri 2
# Linux stack (tauri/tao/wry) and have no patched GTK3 successor. Downgrade
# to warn so the audit still surfaces them without blocking the build.
unmaintained = "warn"

[bans]
multiple-versions = "warn"
skip = [
    # schemars 1.x pins an older serde_inline; both are transitive and used.
    { name = "serde_inline", version = "0.1" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Weak copyleft in the Tauri/dom_query dependency tree.
    "MPL-2.0",
    # LLVM/rustc toolchain crates carry the exception clause.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
