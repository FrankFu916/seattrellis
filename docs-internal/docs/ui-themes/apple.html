<!doctype html>

<head>

  <title>SeatTrellis · Apple-inspired</title>

<body class="apple-body">
  <main class="page">
    <nav class="preview-nav"><a class="back-link" href="./index.html">主题总览</a><div class="preview-links"><a href="./fluent-windows.html">Windows</a><a href="./material-android.html">Android</a><a href="./calm-hybrid.html">Calm</a></div></nav>
    <section class="app-preview apple-app">
      <header class="apple-top">
        <div class="apple-brand">SeatTrellis</div>
        <div class="apple-segment"><span>数据</span><span>规则</span><span class="active">方案</span><span>导出</span></div>

      </header>
      <div class="apple-main">
        <section>
          <div class="apple-hero">
            <div class="eyebrow">Apple-inspired</div>
            <h1>让今天的座位，安静就绪。</h1>
            <p>这个方向几乎不强调“系统管理”，而强调轻松、可靠、少打扰。适合老师快速完成一次排座。</p>
          </div>
          <div class="apple-board">
            <div class="seats-compact">
              <div class="seat"><small>R1C1</small><strong>林安</strong></div><div class="seat"><small>R1C2</small><strong>周雨</strong></div><div class="seat"><small>R1C3</small><strong>陈晓</strong></div><div class="seat"><small>R1C4</small><strong>空位</strong></div><div class="seat"><small>R1C5</small><strong>宋可</strong></div><div class="seat"><small>R1C6</small><strong>韩舟</strong></div>
              <div class="seat"><small>R2C1</small><strong>王一</strong></div><div class="seat"><small>R2C2</small><strong>赵宁</strong></div><div class="seat"><small>R2C3</small><strong>许然</strong></div><div class="seat"><small>R2C4</small><strong>钱泽</strong></div><div class="seat"><small>R2C5</small><strong>顾南</strong></div><div class="seat"><small>R2C6</small><strong>唐小满</strong></div>
            </div>
          </div>
        </section>
        <aside class="apple-inspector">
          <h2>推荐方案</h2>
          <div class="apple-metric"><span>综合评分</span><strong>94</strong></div>
          <div class="apple-metric"><span>硬约束</span><strong>通过</strong></div>
          <div class="apple-metric"><span>隐私模板</span><strong>公示版</strong></div>
          <div class="apple-metric"><span>导出</span><strong>Print HTML</strong></div>
        </aside>
      </div>
    </section>
