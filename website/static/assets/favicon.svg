<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b36"/><stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="230" rx="118" fill="#ffffff" opacity="0.03"/>
  <!-- orbit track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#232e4e" stroke-width="10"/>
  <!-- six seats on the ring; one dashed = the empty seat waiting for its turn -->
  <g transform="translate(256 256)">
    <g transform="rotate(0)   translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="url(#c1)"/></g>
    <g transform="rotate(60)  translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="url(#c2)"/></g>
    <g transform="rotate(120) translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="url(#c3)"/></g>
    <g transform="rotate(180) translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="none" stroke="#42527a" stroke-width="7" stroke-dasharray="17 13"/></g>
    <g transform="rotate(240) translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="url(#c4)"/></g>
    <g transform="rotate(300) translate(0 -150)"><rect x="-50" y="-38" width="100" height="76" rx="22" fill="url(#c5)"/></g>
    <!-- anchor hub -->
    <circle r="30" fill="#f8fafc"/>
    <circle r="13" fill="#0b0f1e"/>
    <!-- motion arrow: inside the ring, curving toward the empty seat -->
    <path d="M 336.9 314.8 A 100 100 0 0 1 293.5 348.7" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
    <path d="M 276.8 355.5 L 289.8 339.4 L 297.2 358.0 Z" fill="#f8fafc"/>
  </g>
</svg>
